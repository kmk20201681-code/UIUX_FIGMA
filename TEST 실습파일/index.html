<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestseller Section</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="nomal.css">
</head>
<body>
    <!-- 홈페이지 상단 -->
    <header>상단바</header>
    <!-- 홈페이지 메인 -->
    <main>
        <section class="bestsellers-section">
            <!-- 섹션 상단 부분 -->
            <div class="ul-nav">
                <div class="section-title">Bestseller</div>
                <div class="view-all">view-all</div>
            </div>
            <!-- 섹션 하단 부분 -->
            <div class="amp-swiper">
                <!-- 섹션 안 리스트 01 -->
                <div class="best-product-list best-product-list01">
                    <div class="product-img-box">
                        <img src="#" alt="향수 이미지">
                    </div>
                    <p class="best-discount-title">Niacinamide 10% + Zinc 1%</p>
                    <p class="best-discount-subhead">Oil Control, Brightens, Smooths</p>
                    <div class="best-price-capacity">
                        <a class="best-price" href="#">₩8700 KRW</a>
                        <a class="best-capacity" href="#">
                            <span class="best-price-30ml">30ml</span>
                            <span class="best-price-60ml">60ml</span>
                        </a>
                    </div>
                    <button class="best-pro-btn">Add to Cart</button>
                </div>
                <!-- 섹션 안 리스트 02 -->
                <div class="best-product-list best-product-list02"></div>
                <!-- 섹션 안 리스트 03 -->
                <div class="best-product-list best-product-list03"></div>
                <!-- 섹션 안 리스트 04 -->
                <div class="best-product-list best-product-list04"></div>
            </div>
        </section>
    </main>
    <!-- 홈페이지 하단 -->
    <footer>하단바</footer>
</body>
</html>
